<div class="in max">
    <div class="finder">
      <div class="frow"><label class="mono" for="h">What’s my size?</label><output for="h" id="hv">176 cm</output></div>
      <input id="h" type="range" min="150" max="200" value="176" step="1" aria-describedby="fitMsg">
      <p id="fitMsg">Probably size 54 or 56.</p>
    </div>
    <div class="chips" role="group" aria-label="Filter bikes" id="chips"></div>
    <div class="avail" id="avail">
      <div class="avail__box">
        <button type="button" class="avail__f" id="availA" data-dp><span class="mono">Pick-up</span><b>Add date</b></button><button type="button" class="avail__f" id="availB" data-dp><span class="mono">Return</span><b>Add date</b></button>
      </div>
      <button type="button" class="pillbtn ink avail__go" id="availGo" data-dp>Check availability</button>
      <button type="button" class="avail__clear" id="availClear" hidden>Clear dates</button>
    </div>
    <div class="dp" id="dp" hidden>
      <div class="dp__in" role="dialog" aria-modal="true" aria-labelledby="dpT">
        <div class="dp__hd">
          <div class="dp__tt"><h3 id="dpT">Select dates</h3><p id="dpHint">Pick the day you collect the bike.</p></div>
          <div class="avail__box dp__sel"><span class="avail__f" id="dpA"><span class="mono">Pick-up</span><b>Add date</b></span><span class="avail__f" id="dpB"><span class="mono">Return</span><b>Add date</b></span></div>
          <button type="button" class="dp__x" id="dpX" aria-label="Close">×</button>
        </div>
        <div class="dp__cal"><button type="button" class="dp__nav" id="dpPrev" aria-label="Earlier months">‹</button><div class="dp__months" id="dpMonths"></div><button type="button" class="dp__nav" id="dpNext" aria-label="Later months">›</button></div>
        <div class="dp__ft"><p class="dp__key"><s>12</s> no bike free · <i></i> one or two left</p><button type="button" class="avail__clear" id="dpClear">Clear dates</button><button type="button" class="pillbtn ink" id="dpDone">Close</button></div>
      </div>
    </div>
    <p class="count" id="msg" aria-live="polite"></p>
  </div>
  <ul class="grid max" id="list"></ul>
