name: Release

# Publishes a GitHub release with
#   cc-fleet-<plugin version>.zip and community-connect-<theme version>.zip
# whenever a push to main raises the plugin or theme version (or when run by hand
# under Actions → Release → Run workflow). The website's updater
# (Fleet Manager → Updates) picks them up.

on:
  push:
    branches: [main]
    paths:
      - 'cc-fleet/cc-fleet.php'
      - 'community-connect/style.css'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        run: |
          PV=$(grep -m1 -E "^\s*\*\s*Version:" cc-fleet/cc-fleet.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          TV=$(grep -m1 -E "^Version:" community-connect/style.css | sed -E 's/Version:\s*//; s/\s+$//')
          echo "plugin=$PV" >> "$GITHUB_OUTPUT"
          echo "theme=$TV" >> "$GITHUB_OUTPUT"
          echo "tag=v${PV}-theme-${TV}" >> "$GITHUB_OUTPUT"
          echo "Plugin $PV, theme $TV"

      - name: Skip if this pair of versions is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already released."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zips
        if: steps.exists.outputs.skip == 'false'
        run: |
          mkdir -p dist
          zip -qr "dist/cc-fleet-${{ steps.v.outputs.plugin }}.zip" cc-fleet -x "cc-fleet/tests/*" "*.DS_Store"
          zip -qr "dist/community-connect-${{ steps.v.outputs.theme }}.zip" community-connect -x "*.DS_Store"
          ls -la dist

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Plugin ${{ steps.v.outputs.plugin }} · Theme ${{ steps.v.outputs.theme }}" \
            --notes "CC Fleet plugin ${{ steps.v.outputs.plugin }} and Community Connect theme ${{ steps.v.outputs.theme }}. See cc-fleet/README.md for what changed." \
            --latest
